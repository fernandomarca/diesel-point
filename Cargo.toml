[package]
name = "diesel-point"
version = "0.1.1"
edition = "2021"
authors = ["fernandomarca"]
readme = "README.md"
license = "MIT OR Apache-2.0"

repository = "https://github.com/fernandomarca/diesel-point"
documentation = "https://docs.rs/diesel-point"
description = "Diesel support for Point types in Postgres"
keywords = ["sql", "orm", "diesel", "postgres", "point"]
categories = ["database"]

[dependencies]
diesel = { version = "2.3.5", features = ["postgres"] }
serde = { version = "1", features = ["derive"], optional = true }
byteorder = "1.5.0"
utoipa = { version = "5.4.0", optional = true }

[features]
default = []

serde = ["dep:serde"]
utoipa = ["dep:utoipa", "dep:serde"]
